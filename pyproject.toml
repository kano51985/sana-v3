[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sana-v2"
version = "0.2.0"
description = "Multi-user research and memory platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "chromadb>=1.5,<2",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "openai>=2.47,<3",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-httpx>=0.59b0,<1",
    "opentelemetry-sdk>=1.38,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.12,<3",
    "PyJWT[crypto]>=2.10,<3",
    "pymongo>=4.17,<5",
    "redis>=5.2,<6",
    "requests>=2.34,<3",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "streamlit>=1.60,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.31,<3",
    "hypothesis>=6.138,<7",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
]

[tool.setuptools.packages.find]
include = ["sana*", "interfaces*"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_network: permits a test to connect to non-loopback network addresses",
    "postgres: requires an isolated PostgreSQL test service",
    "redis: requires an isolated Redis test service",
]
