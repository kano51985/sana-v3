x-sana-environment: &sana-environment
  SANA_ENVIRONMENT: ${SANA_ENVIRONMENT:-local}
  SANA_DATABASE_URL: ${SANA_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_APP_USER:-sana_app}:${POSTGRES_APP_PASSWORD:-sana-app}@postgres:5432/sana}
  SANA_REDIS_URL: ${SANA_REDIS_URL:-redis://redis:6379/1}
  SANA_CELERY_BROKER_URL: ${SANA_CELERY_BROKER_URL:-redis://redis:6379/0}
  SANA_AUTH_MODE: ${SANA_AUTH_MODE:-dev}
  SANA_ARTIFACT_ROOT: ${SANA_ARTIFACT_ROOT:-/var/lib/sana/artifacts}
  SANA_DEV_AUTH_ENABLED: ${SANA_DEV_AUTH_ENABLED:-true}
  SANA_OIDC_ISSUER: ${SANA_OIDC_ISSUER:-}
  SANA_OIDC_AUDIENCE: ${SANA_OIDC_AUDIENCE:-}
  SANA_OIDC_JWKS_URL: ${SANA_OIDC_JWKS_URL:-}

x-sana-image: &sana-image
  build:
    context: ..
    dockerfile: deployment/Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: sana-v2:local
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sana
      POSTGRES_USER: sana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sana}
    volumes:
      - sana-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sana -d sana"]
      interval: 5s
      timeout: 3s
      retries: 20

  provision-db-role:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: sana
      PGUSER: sana
      PGPASSWORD: ${POSTGRES_PASSWORD:-sana}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - app_user=${POSTGRES_APP_USER:-sana_app}
      - -v
      - app_password=${POSTGRES_APP_PASSWORD:-sana-app}
      - -f
      - /opt/sana/provision-app-role.sql
    volumes:
      - ./postgres/provision-app-role.sql:/opt/sana/provision-app-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sana-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *sana-image
    restart: "no"
    environment:
      <<: *sana-environment
      SANA_DATABASE_URL: postgresql+asyncpg://sana:${POSTGRES_PASSWORD:-sana}@postgres:5432/sana
    command: ["alembic", "upgrade", "head"]
    depends_on:
      provision-db-role:
        condition: service_completed_successfully

  bootstrap-dev:
    <<: *sana-image
    profiles: ["dev-bootstrap"]
    restart: "no"
    environment: *sana-environment
    command: ["python", "-m", "sana.app.bootstrap_dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  artifact-init:
    <<: *sana-image
    profiles: ["workers"]
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R sana:sana /var/lib/sana/artifacts"]
    volumes:
      - sana-artifacts:/var/lib/sana/artifacts

  api:
    <<: *sana-image
    environment: *sana-environment
    command: ["python", "-m", "uvicorn", "sana.app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${SANA_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  dispatcher:
    <<: *sana-image
    profiles: ["workers"]
    environment: *sana-environment
    command: ["python", "-m", "sana.app.outbox_dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully

  worker:
    <<: *sana-image
    profiles: ["workers"]
    environment:
      <<: *sana-environment
      SANA_STEP_HANDLER_FACTORY: ${SANA_STEP_HANDLER_FACTORY:-sana.app.production_worker:create_handler}
      SANA_WORKER_PLANNER_PROVIDER: ${SANA_WORKER_PLANNER_PROVIDER:-heuristic}
      SANA_WORKER_PLANNER_MODEL: ${SANA_WORKER_PLANNER_MODEL:-}
      SANA_WORKER_DISCOVERY_PROVIDERS: ${SANA_WORKER_DISCOVERY_PROVIDERS:-bing_rss}
      SANA_WORKER_SEARXNG_URL: ${SANA_WORKER_SEARXNG_URL:-}
      SANA_WORKER_MAX_SELECTED_HITS: ${SANA_WORKER_MAX_SELECTED_HITS:-4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["python", "-m", "celery", "-A", "sana.app.worker_entrypoint:app", "worker", "--loglevel", "INFO", "--queues", "fast,research,crawl,maintenance", "--concurrency", "2"]
    volumes:
      - sana-artifacts:/var/lib/sana/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully

  streamlit:
    <<: *sana-image
    environment:
      SANA_API_URL: http://api:8000
    command: ["python", "-m", "streamlit", "run", "sana/clients/streamlit/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "${SANA_UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sana-postgres:
  sana-redis:
  sana-artifacts:
